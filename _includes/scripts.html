<script>
document.addEventListener('DOMContentLoaded', function() {
  // Hero glitch on hover
  const hero = document.querySelector('.hero-glitch');
  if (hero) {
    hero.addEventListener('mouseenter', () => hero.classList.add('glitch-active'));
    hero.addEventListener('mouseleave', () => {
      setTimeout(() => hero.classList.remove('glitch-active'), 350);
    });
  }

  // Header scroll state
  const header = document.querySelector('.site-header');
  if (header) {
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          header.classList.toggle('scrolled', window.scrollY > 20);
          ticking = false;
        });
        ticking = true;
      }
    });
  }

  // Staggered scroll reveal for post cards
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        const delay = entry.target.dataset.delay || 0;
        setTimeout(() => entry.target.classList.add('revealed'), delay);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.post-card').forEach((card, i) => {
    card.dataset.delay = (i % 5) * 80;
    observer.observe(card);
  });

  // Reading progress bar
  const progress = document.getElementById('readingProgress');
  if (progress) {
    const article = document.querySelector('.post-body');
    let ticking = false;
    const updateProgress = () => {
      if (!article) return;
      const rect = article.getBoundingClientRect();
      const total = rect.height - window.innerHeight + 200;
      const scrolled = Math.max(0, -rect.top + 100);
      const pct = Math.min(100, Math.max(0, (scrolled / total) * 100));
      progress.style.width = pct + '%';
      ticking = false;
    };
    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateProgress);
        ticking = true;
      }
    });
    updateProgress();
  }

  // Code block copy button
  document.querySelectorAll('pre').forEach(block => {
    // Skip if already has a copy button
    if (block.querySelector('.copy-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      const code = block.querySelector('code');
      const text = code ? code.textContent : block.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        btn.style.color = 'var(--sage)';
        btn.style.borderColor = 'var(--sage)';
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.style.color = '';
          btn.style.borderColor = '';
        }, 2000);
      });
    });
    block.style.position = 'relative';
    block.appendChild(btn);
  });
});
</script>
