title: Toby's Blog
description: 探索技术、AI与未来的个人博客
url: "https://blog.toby-blog.com"
baseurl: ""
lang: zh-CN
author: Toby
timezone: Asia/Shanghai

theme: null

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

highlighter: rouge

paginate: 10
paginate_path: "/page/:num/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
